name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run coding standards, tests and bilingual coverage
        run: bash bin/run-with-diagnostics.sh "PHP quality" -- composer verify

      - name: Upload PHP quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-quality-diagnostics
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  bilingual-coverage:
    name: EN/ES 100% coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify EN/ES catalog coverage
        run: bash bin/run-with-diagnostics.sh "EN ES coverage" -- php bin/check-i18n.php

      - name: Build bilingual production package
        run: bash bin/run-with-diagnostics.sh "Bilingual production package" -- bash bin/build-plugin.sh

      - name: Verify compiled Spanish catalog
        run: test -s build/ai-transparency/languages/ai-transparency-es_ES.mo

      - name: Upload bilingual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-coverage-diagnostics
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  php-compatibility:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint production PHP
        shell: bash
        run: >-
          bash bin/run-with-diagnostics.sh "PHP ${{ matrix.php }} syntax" --
          bash -c 'set -euo pipefail; while IFS= read -r -d "" file; do php -l "$file"; done < <(find . -path "./vendor" -prune -o -path "./build" -prune -o -path "./node_modules" -prune -o -name "*.php" -print0)'

      - name: Upload PHP syntax diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}-syntax-diagnostics
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  wordpress-plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production plugin package
        run: bash bin/run-with-diagnostics.sh "WordPress production package" -- bash bin/build-plugin.sh

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/ai-transparency
          wp-version: latest
          categories: |
            plugin_repo
            security
            accessibility
            performance

      - name: Upload package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-package-diagnostics
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  wordpress-runtime-acceptance:
    name: WordPress runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production plugin package
        run: bash bin/run-with-diagnostics.sh "Runtime production package" -- bash bin/build-plugin.sh

      - name: Install pinned runtime tooling
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start single-site WordPress
        run: bash bin/run-with-diagnostics.sh "WordPress single-site start" -- npm exec -- wp-env start

      - name: Verify production plugin activation
        run: bash bin/run-with-diagnostics.sh "WordPress plugin activation" -- npm exec -- wp-env run cli -- wp plugin is-active ai-transparency

      - name: Run real migration smoke
        run: bash bin/run-with-diagnostics.sh "WordPress migration smoke" -- npm exec -- wp-env run cli -- wp eval-file wp-content/ai-transparency-runtime-tests/single-site-smoke.php

      - name: Configure ephemeral runtime users
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASS="$(openssl rand -hex 18)"
          EDITOR_PASS="$(openssl rand -hex 18)"
          npm exec -- wp-env run cli -- wp user update admin --user_pass="${ADMIN_PASS}"
          npm exec -- wp-env run cli -- wp user create phase2_editor phase2-editor@example.test --role=editor --user_pass="${EDITOR_PASS}"
          {
            echo "WP_TEST_ADMIN_USER=admin"
            echo "WP_TEST_ADMIN_PASS=${ADMIN_PASS}"
            echo "WP_TEST_EDITOR_USER=phase2_editor"
            echo "WP_TEST_EDITOR_PASS=${EDITOR_PASS}"
          } >> "$GITHUB_ENV"

      - name: Run CRUD, permission, responsive and accessibility acceptance
        env:
          WP_BASE_URL: http://localhost:8888
        run: bash bin/run-with-diagnostics.sh "WordPress browser acceptance" -- npm run test:e2e

      - name: Stop single-site WordPress
        if: always()
        run: npm exec -- wp-env stop || true

      - name: Start Multisite WordPress
        run: bash bin/run-with-diagnostics.sh "WordPress Multisite start" -- npm exec -- wp-env start --config=.wp-env.multisite.json

      - name: Run real Multisite isolation smoke
        run: >-
          bash bin/run-with-diagnostics.sh "WordPress Multisite isolation" --
          npm exec -- wp-env run cli --config=.wp-env.multisite.json --
          wp eval-file wp-content/ai-transparency-runtime-tests/multisite-smoke.php

      - name: Stop Multisite WordPress
        if: always()
        run: npm exec -- wp-env stop --config=.wp-env.multisite.json || true

      - name: Upload runtime acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-runtime-acceptance-diagnostics
          path: |
            .ci-diagnostics/
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
